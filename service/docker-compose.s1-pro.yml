# Manual mammoth-1 sidecar + miner, kit 0.1.9.
# Use your own non-root UID/GID. Create secrets/runtime-token (0600), copy miner.env.example to miner.env.
# Public weights: hf download baselabs/mammoth-1 --revision 61cec44c281c693992e3d6ebeb44dd3402dfa186 --local-dir /srv/reax/mammoth-1
# Set REAX_S1_PRO_WEIGHTS=/srv/reax/mammoth-1 and REAX_FLA_CONFIGS=<kit>/configs/rtx-pro-6000-blackwell-server.
# Verify in that config directory: sha256sum -c SHA256SUMS. Never publish port 8102.
# No Rune CC override; it is unverified for mammoth. Run reaxctl selfcheck and require PASS before serving.
services:
  runtime:
    image: ghcr.io/reaxlabs/reax-engine-ref-mammoth@sha256:3080a593060542bccbdaf7cf0c66593fc182d9753b3facd50206df86d93b8588
    user: "${REAX_UID:?set REAX_UID=$(id -u)}:${REAX_GID:?set REAX_GID=$(id -g)}"
    init: true
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,nodev,size=16g"]
    shm_size: "2g"
    pids_limit: 4096
    environment:
      S1M_INTERNAL_TOKEN_FILE: /run/runtime-token
      RUNTIME_HOST: 127.0.0.1
      RUNTIME_PORT: "8102"
      RUNTIME_UDS: ""
      REAX_MODEL: mammoth-1
      REAX_PROFILE: reference
      CIE_LAZY_LOAD: "1"
      REAX_MAX_WAIT_MS: "4"
      FLA_CACHE_MODE: strict
      FLA_CONFIG_DIR: /opt/reax/fla-configs/rtx-pro-6000-blackwell-server
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./secrets/runtime-token:/run/runtime-token:ro
      - ${REAX_S1_PRO_WEIGHTS:?set REAX_S1_PRO_WEIGHTS to the hf download --local-dir directory}:/model:ro
      - ${REAX_FLA_CONFIGS:?set REAX_FLA_CONFIGS to the verified bundled configs}:/opt/reax/fla-configs/rtx-pro-6000-blackwell-server:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}
  miner:
    image: ghcr.io/reaxlabs/reax-miner@sha256:4a492434622abfc8fc856439a9662da6649beb5a4cb9dbc6df4934a1560c73ff
    user: "${REAX_UID:?set REAX_UID=$(id -u)}:${REAX_GID:?set REAX_GID=$(id -g)}"
    init: true
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: miner.env
    depends_on:
      runtime:
        condition: service_healthy   # weights hash check + model load, a few minutes
    environment:
      REAX_MECHANISM: s1
      REAX_MODEL: s1-pro
      REAX_PER_CALLER_CONCURRENCY: "64"
      REAX_PER_CALLER_PER_MINUTE: "728"
      REAX_MAX_CONCURRENT: "16"
      REAX_MAX_PENDING_PER_IP: "128"
      REAX_S1_PRO_RUNTIME_URL: http://127.0.0.1:8102
      REAX_RUNTIME_TOKEN_FILE: /run/reax-runtime-token
      REAX_PUBLISH_COMMITMENT: "1"   # reax-s1/1:s1-pro:3f3558e583b0a1d6
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${HOME}/.bittensor/wallets:/wallets:ro
      - ./secrets/runtime-token:/run/reax-runtime-token:ro
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}
