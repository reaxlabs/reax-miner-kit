# SN92 T2 DEBUG only: drop-in for ssh.service. Host keys are not stored in the image; make fresh ones per boot.
# Live finding 24 Nov 2026: a separate unit with Before=ssh.socket created an ordering cycle
# (ssh.socket -> sockets.target -> basic.target -> unit) and systemd dropped ssh.socket: port 22 refused.
# A drop-in adds no ordering at all.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
