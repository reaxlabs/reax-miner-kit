# SN92 T2: the verified rootfs is an overlay; podman's overlay driver refuses an overlay graphroot.
# graphroot is a fresh tmpfs (fstab); preloaded images are read from the verified squashfs directly.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/run/sn92-t2/lower/var/lib/containers/storage"]
